  - id: CL-35
    text: >-
      An Assignment can now be created from a Work Item through the existing
      governed Assignment lifecycle. After creation, the Assignment appears
      immediately and its dossier view opens directly.
    tier: Verified
    date: '2026-08-07'
    source: 'AIWHQ-CODEX-BTFDR-001.md · verified product fact from AIW-CODEX-BTFDR-004'
    routes: ['/platform']
    reverify: { cadence: quarterly, last: '2026-08-07' }
  - id: CL-36
    text: >-
      An Assignment dossier can now validate readiness against governed
      contract and lifecycle state, show actionable failures, identify eligible
      Executors from recorded capability and authorization state, and route a
      valid Assignment through the governed lifecycle. The resulting Assignment
      and Agent state changes, and the routing audit record, are visible
      immediately.
    tier: Verified
    date: '2026-08-07'
    source: 'AIWHQ-CODEX-BTFDR-002.md · verified product fact from AIW-CODEX-BTFDR-005 · commit 49b1663dd21b37fe353c2fe3e0753fb06157cf78'
    routes: ['/platform']
    reverify: { cadence: quarterly, last: '2026-08-07' }
  - id: CL-37
    text: >-
      A properly routed Assignment can now enter governed execution through an
      accountable Attempt and a time-bounded fenced lease issued to its
      Executor. Assignment and Agent surfaces expose the execution and lease
      state; invalid, stale, or unauthorized activation fails closed, and
      relevant lifecycle events remain auditable.
    tier: Verified
    date: '2026-08-07'
    source: 'AIWHQ-CODEX-BTFDR-003.md · verified product fact from AIW-CODEX-BTFDR-006 · commit cc8b08f20db1240ac2246d27c85ba313621119f6'
    routes: ['/platform']
    reverify: { cadence: quarterly, last: '2026-08-07' }
  - id: CL-38
    text: >-
      An evidence-backed submitted result can now pass through deterministic
      verification, criterion-level findings, authorized human approval or
      rejection, and auditable completion. Remediable failures create a new
      Attempt while prior Attempts, results, evidence, verifications, and
      decisions remain inspectable and unchanged.
    tier: Verified
    date: '2026-08-07'
    source: 'AIWHQ-CODEX-BTFDR-004.md · verified product fact from AIW-CODEX-BTFDR-008 · commit 5e765dd'
    routes: ['/platform']
    reverify: { cadence: quarterly, last: '2026-08-07' }
