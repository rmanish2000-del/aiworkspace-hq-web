name: deploy
# Self-hosted deploy to Cloudflare Workers — works without Lovable.
# Runs only when the two Cloudflare secrets exist, so it is safe before setup.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets not set; deploy skipped." && exit 0
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bun install --frozen-lockfile && bun run build
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bunx wrangler@4 deploy --config .output/server/wrangler.json --name aiworkspacehq
      - name: Smoke test (after the custom domain points at this worker)
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.SITE_URL != ''
        run: |
          for path in / /services /process /pricing; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SITE_URL }}$path")
            echo "$path -> $code"; [ "$code" = "200" ] || exit 1
          done
