<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Placeholder icon">
  <!--
    PLACEHOLDER ICON — NOT A BRAND ASSET.

    Two offset rounded rectangles: a plain geometric glyph carrying no wordmark,
    no monogram, no logotype, and no letterform. It exists so the browser's
    implicit /favicon.ico request resolves instead of 404ing, and so the tab has
    something neutral in it.

    P0 `07` §11 suggests an "AI" monogram for the real icon. That is deliberately
    NOT used: a monogram is a brand asset, and AWHQ-AUT-P1F P-15 blocks brand
    assets while 0 of 8 IP assets have evidenced ownership (Open Item E).

    Replace this file wholesale when P-15 lifts. Do not edit it toward a brand.

    Colours follow the OS scheme so the icon stays legible on either tab colour.
  -->
  <style>
    .glyph { fill: #111315; }
    .glyph-back { fill: #848b92; }
    @media (prefers-color-scheme: dark) {
      .glyph { fill: #f2f4f5; }
      .glyph-back { fill: #7a8288; }
    }
  </style>
  <rect class="glyph-back" x="4" y="4" width="18" height="18" rx="4" />
  <rect class="glyph" x="10" y="10" width="18" height="18" rx="4" />
</svg>
