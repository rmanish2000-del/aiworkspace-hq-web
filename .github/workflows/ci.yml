name: CI

# Every job below blocks merge to `main` (P0 `08` §14, P1-A §4.3).
#
# Gates from `08` §14 that are NOT present here, each with a reason:
#   - Lighthouse budgets are measured on the deployed production URL (`08` §8).
#     The job below runs them against the local build and is INDICATIVE ONLY —
#     see AWHQ-AUT-P1F §7.2. It is not Gate B evidence.
#   - Post-deploy header check (`08` §9.2): there is no deployment (P-01) and no
#     hosting vendor (P-02), so the headers cannot be set or asserted yet.
#   - E2E form tests: no form exists in this scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No outbound telemetry from the build (see README, "External requests").
  ASTRO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 'Types — tsc --noEmit'
        run: npm run check:types

      - name: 'Lint — ESLint'
        run: npm run lint

      - name: 'Format — Prettier --check'
        run: npm run format:check

      - name: 'Unit tests — Vitest (includes the prohibited-term gate)'
        run: npm run test:unit

  build:
    name: Build and validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: HTML validity
        run: npm run test:html

      - name: Assert no build-time placeholder reached the output
        # `04` header note — {{NAME}} values must never reach the browser.
        run: |
          if grep -rqE '\{\{[^}]+\}\}' dist/; then
            echo "::error::A build-time {{placeholder}} leaked into dist/."
            grep -rnE '\{\{[^}]+\}\}' dist/ || true
            exit 1
          fi
          echo "No build-time placeholders in dist/."

      - name: Assert the client JavaScript budget
        # 08 ARCH-06 / section 8 — 10 KB gzipped ceiling. This scope ships zero
        # bytes, so the uncompressed total is compared against the same number:
        # if uncompressed already fits, gzipped certainly does.
        run: |
          bytes=$(find dist -name '*.js' -type f -printf '%s\n' 2>/dev/null \
                  | awk '{ total += $1 } END { print total + 0 }')
          echo "Client JavaScript in dist/: ${bytes} bytes (uncompressed)"
          if [ "$bytes" -gt 10240 ]; then
            echo "::error::Client JS budget exceeded (08 ARCH-06)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  release-gates:
    # The gates that caught nothing on 2026-08-09 because they only ran
    # locally: DS contrast/motion/budget gates, the claim-ledger trace
    # (G-LEDGER) and the C-13 storage suite (G-C13). A public string with no
    # ledger entry now fails the PR, not the next local verify:release.
    name: Release gates (DS, G-LEDGER, G-C13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Design-system gates (CC-004 §9)
        run: node scripts/ds-gates.mjs

      - name: Claim-ledger gate (G-LEDGER)
        run: node scripts/ledger-gate.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: C-13 verification (G-C13)
        run: npx playwright test tests/e2e/c13-verification.spec.ts --project=chromium-light

  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: internal links only. The site is not deployed and must
          #   make no outbound request (P-02, P-09), so external URLs are never
          #   resolved.
          # --root-dir: required to resolve root-relative hrefs such as the
          #   404 page's link to `/`. Without it lychee cannot tell what `/`
          #   means for a file on disk, and reports it as an error.
          # --include-fragments: so an in-page anchor pointing at a missing id
          #   fails here. That is the gate that keeps the omitted hero CTA
          #   honest.
          # --fallback-extensions html: routes are extensionless (`/platform`),
          #   but a static build writes `platform.html`. Without this every
          #   internal route link reads as a missing file.
          # --exclude 'dist#interest$': the nav CTA is `/#interest`, which
          #   resolves to the dist DIRECTORY plus a fragment — something lychee
          #   cannot check offline. That link is verified instead by
          #   tests/e2e/routes.spec.ts, which fetches every internal href and
          #   asserts the fragment target exists. Same-page `#interest` links
          #   are still checked here.
          # --exclude 'warrant/console$': FD-W1 footer link to the proxied
          #   Warrant console (PR #19). It exists only at the edge rewrite,
          #   never as a local file; CC-009's live post-launch checks cover it.
          args: >-
            --offline --no-progress --include-fragments
            --fallback-extensions html
            --exclude 'dist#interest$'
            --exclude 'warrant/console$'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

  a11y-and-e2e:
    name: Accessibility and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # P1-M §3 requires all three engines. This is also the only place Firefox
      # runs: Playwright's Firefox build will not start on the Windows
      # development machine (Win32 side-by-side activation failure on the
      # `mozglue` private assembly). See docs/reviews/known-limitations.md L-11.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run build

      - name: Playwright (axe-core, manual a11y, viewports, three engines)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (indicative only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        # `08` §8 budgets are defined against the deployed production URL under
        # mobile emulation, 4x CPU throttling and Slow 4G. None of that exists
        # here. Treat a pass as a smoke signal, not as evidence (P1-F §7.2).
        run: npm run test:lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull_request event the gitleaks action lists the PR's commits via
      # /pulls/{n}/commits, which the workflow-level `contents: read` alone does
      # not allow. Without this the job fails with 403 "Resource not accessible
      # by integration" — which reads like a secret finding and is not one.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: npm audit (high and critical block)
        run: npm run audit:deps

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
